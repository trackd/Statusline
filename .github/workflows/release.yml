name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release module and CLI together, or attach CLI assets to the existing module release
        type: choice
        options: [module-and-cli, cli-only]
        default: module-and-cli

permissions:
  contents: read

concurrency:
  group: release-statusline
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "& ([scriptblock]::Create([IO.File]::ReadAllText('{0}')))"

jobs:
  prepare:
    name: Select release version
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select release version
        id: version
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Import-PowerShellDataFile ./module/StatusLine.psd1
          $moduleName = [IO.Path]::GetFileNameWithoutExtension($manifest.RootModule)
          $baseVersion = [version]$manifest.ModuleVersion
          if ($env:RELEASE_MODE -eq 'cli-only') {
              gh release view "v$baseVersion" --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE) { throw 'CLI-only mode requires an existing release matching the manifest version.' }
              "version=$baseVersion" >> $env:GITHUB_OUTPUT
              Write-Host "Attach CLI to existing release v$baseVersion"
              exit 0
          }
          $serviceIndex = Invoke-RestMethod https://pwsh.gallery/index.json
          $packageBase = $serviceIndex.resources |
              Where-Object { $_.'@type' -eq 'PackageBaseAddress/3.0.0' } |
              Select-Object -First 1 -ExpandProperty '@id'
          if (-not $packageBase) { throw 'pwsh.gallery did not advertise a NuGet package base address.' }
          $versionsUrl = "$($packageBase.TrimEnd('/'))/$($moduleName.ToLowerInvariant())/index.json"
          try {
              $publishedVersions = (Invoke-RestMethod -Uri $versionsUrl -ErrorAction Stop).versions
          }
          catch {
              # Only a missing package means first publication; outages must fail the job.
              if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
              $publishedVersions = @()
          }
          foreach ($publishedVersion in $publishedVersions) {
              if ($publishedVersion -like '*-*') { continue }
              $published = [version](($publishedVersion -split '\+', 2)[0])
              if ($published -gt $baseVersion) { $baseVersion = $published }
          }
          $version = [version]::new($baseVersion.Major, $baseVersion.Minor + 1, 0)
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

  validate:
    name: Validate release
    if: inputs.mode != 'cli-only'
    needs: prepare
    uses: ./.github/workflows/validate.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  native:
    name: Build CLI for existing release
    if: inputs.mode == 'cli-only'
    needs: prepare
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish module and release assets
    if: inputs.mode != 'cli-only'
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: statusline-*
          path: artifacts/release

      - name: Prepare release
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_VERSION: ${{ needs.prepare.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PSGALLERY_API_KEY) { throw 'Set the PSGALLERY_API_KEY repository secret before releasing.' }
          Install-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.1.0 -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
          ./.github/Set-ModuleVersion.ps1 -Version $env:MODULE_VERSION
          $manifest = Import-PowerShellDataFile ./module/StatusLine.psd1
          $moduleName = [IO.Path]::GetFileNameWithoutExtension($manifest.RootModule)
          $tag = "v$env:MODULE_VERSION"
          $assets = @(& ./.github/Get-ReleaseAssets.ps1 -Version $env:MODULE_VERSION -Path ./artifacts/release)
          $package = $assets | Where-Object Name -CEQ "$moduleName.$env:MODULE_VERSION.nupkg"
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing release tags.' }
          if ($tags.ref -contains "refs/tags/$tag") { throw "Tag $tag already exists." }

          git config user.name 'trackd'
          git config user.email '17672644+trackd@users.noreply.github.com'
          git add -- module/StatusLine.psd1
          git commit -m "Release $tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit release version.' }
          # No force push: stop before publishing if the branch moved during validation.
          git push origin "HEAD:refs/heads/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push the release commit. Check branch protection or restart from the current default branch.' }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release commit.' }
          "path=$($package.FullName)" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Publish to PSGallery
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.1.0
          Publish-PSResource -NupkgPath $env:PACKAGE_PATH -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.package.outputs.commit }}
          MODULE_VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          $assets = @(& ./.github/Get-ReleaseAssets.ps1 -Version $env:MODULE_VERSION -Path ./artifacts/release)
          gh release create $env:RELEASE_TAG --target $env:RELEASE_COMMIT --generate-notes @($assets.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed. The package was already published to PSGallery; use the retained package to finish the release.' }

  attach:
    name: Attach CLI to existing release
    if: inputs.mode == 'cli-only'
    needs: [prepare, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: statusline-*
          path: artifacts/release
      - name: Attach versioned native packages
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:MODULE_VERSION"
          $assets = @(& ./.github/Get-ReleaseAssets.ps1 -Version $env:MODULE_VERSION -Path ./artifacts/release -NativeOnly)
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'The target release does not exist.' }
          if (@($assets | Where-Object { $_.Name -cin $release.assets.name }).Count) {
              throw 'The release already has matching CLI assets; no files were uploaded.'
          }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY @($assets.FullName)
          if ($LASTEXITCODE) { throw 'Could not attach native release assets. Existing assets are not overwritten.' }
