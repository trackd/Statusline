name: Native executable

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version selected by the release workflow
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "& ([scriptblock]::Create([IO.File]::ReadAllText('{0}')))"

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  native:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set release version
        if: inputs.version != ''
        env:
          MODULE_VERSION: ${{ inputs.version }}
        run: ./.github/Set-ModuleVersion.ps1 -Version $env:MODULE_VERSION
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux native tools and shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ($LASTEXITCODE) { throw 'apt-get update failed.' }
          sudo apt-get install -y clang zlib1g-dev zsh fish
          if ($LASTEXITCODE) { throw 'Native tool installation failed.' }
      - name: Publish and validate native executable
        run: ./cli/Publish-Native.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Retain executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statusline-${{ matrix.rid }}
          path: |
            artifacts/native/${{ matrix.rid }}/*.tar.gz
            artifacts/native/${{ matrix.rid }}/*.zip
            artifacts/native/${{ matrix.rid }}/*.sha256
          if-no-files-found: error
      - name: Retain failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-failures-${{ matrix.rid }}
          path: |
            artifacts/native/${{ matrix.rid }}/*.binlog
            artifacts/native/${{ matrix.rid }}/test-results.json
          if-no-files-found: ignore
          retention-days: 7
